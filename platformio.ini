[platformio]
src_dir = firmware/src
include_dir = firmware/include

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    knolleary/PubSubClient
build_flags =
    -DCORE_DEBUG_LEVEL=0
